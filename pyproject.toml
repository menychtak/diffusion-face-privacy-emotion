[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-face-privacy-emotion"
version = "0.1.0"
description = "Audited diffusion facial identity obfuscation experiment analysis"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3", "numpy>=1.24,<3", "Pillow>=10,<12"]

[project.optional-dependencies]
test = ["pytest>=8"]
colab-niqe = ["pyiqa==0.1.13", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
